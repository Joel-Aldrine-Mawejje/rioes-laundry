<style>
:root{--bg:#f3faff;--card:#fff;--ink:#0b2a3c;--mut:#5b7a8c;--sky:#38b6f0;--sky2:#1e8fc9;--tint:#e3f4fd;--line:#d3eaf7;--ok:#1a9d6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a24;--card:#112633;--ink:#e6f4fb;--mut:#8fb2c5;--tint:#14384c;--line:#1f3d4f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1a24;--card:#112633;--ink:#e6f4fb;--mut:#8fb2c5;--tint:#14384c;--line:#1f3d4f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
#app{display:flex;min-height:100vh}
.side{display:none;width:220px;padding:20px 14px;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:20px;color:var(--sky2);margin-bottom:14px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.nb{border:0;background:none;color:var(--ink);text-align:left;padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer}
.nb.on{background:var(--tint);color:var(--sky2);font-weight:700}
main{flex:1;padding:16px 14px 90px;max-width:960px;width:100%;margin:0 auto}
.bottom{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom .nb{text-align:center;font-size:11px;padding:8px 2px;border-radius:0}
.bottom .nb span{display:block;font-size:19px}
h2{margin:4px 0 12px;font-size:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:20px;color:var(--sky2)}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag{background:var(--tint);color:var(--sky2);padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
button.p,button.g{border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--sky)}
button.p{background:var(--sky);color:#fff}button.g{background:none;color:var(--sky2)}
a.g{display:inline-block;text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:700;border:1px solid var(--sky);color:var(--sky2)}button.big{width:100%;padding:13px;font-size:16px;margin-top:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}label.ck input{width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--sky);color:#fff;border-color:var(--sky)}
.bar{height:10px;background:var(--sky);border-radius:5px;min-width:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9}
.lines div{display:flex;justify-content:space-between;padding:3px 0}
@media(min-width:800px){.side{display:flex}.bottom{display:none}main{padding:28px 32px}.grid{grid-template-columns:repeat(4,1fr)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{bottom:30px}}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
(function(){const C=window.FIREBASE_CONFIG;if(!C||!C.apiKey||/PASTE/i.test(C.apiKey)||typeof firebase==='undefined')return;
firebase.initializeApp(C);const au=firebase.auth(),fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const clean=x=>JSON.parse(JSON.stringify(x)),
enc=(p,x)=>clean(p=='settings/main'?{...x,sv:(x.sv||[]).map(s=>({n:s[0],p:s[1]}))}:x),
dec=(p,x)=>p=='settings/main'&&x.sv?{...x,sv:x.sv.map(s=>[s.n,s.p])}:x;
const db={collection:n=>({onSnapshot:(cb,eb)=>fs.collection(n).onSnapshot(s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>dec(n+'/'+d.id,d.data())}))}),eb)}),doc:p=>({set:x=>fs.doc(p).set(enc(p,x)),delete:()=>fs.doc(p).delete()})};
let res;const ready=new Promise(r=>res=r);window.claude={use:()=>ready};
document.body.insertAdjacentHTML('beforeend','<div id="lg" style="position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px"><div class="card" style="width:100%;max-width:360px"><h2 style="color:var(--sky2)">Rioes Laundry</h2><div class="mut">Sign in with the account your manager created for you.</div><label>Email</label><input id="le" type="email" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password"><div id="lr" style="color:#e5484d;min-height:20px;margin-top:6px"></div><button class="p big" id="lb">Sign in</button><div style="text-align:center;margin-top:14px"><a href="#" id="lf" style="color:var(--sky2)">Forgot password?</a></div></div></div><button id="so" class="g" style="display:none;position:fixed;right:58px;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:6;padding:4px 10px">Sign out</button>');
const q1=s=>document.querySelector(s);
const go=()=>{q1('#lr').style.color='#e5484d';q1('#lr').textContent='';au.signInWithEmailAndPassword(q1('#le').value.trim(),q1('#lp').value).catch(()=>q1('#lr').textContent='Could not sign in. Check the email and password.')};
q1('#lb').onclick=go;
q1('#lf').onclick=ev=>{ev.preventDefault();const r=q1('#lr'),m=q1('#le').value.trim();r.style.color='#e5484d';if(!m){r.textContent='Type your email above first, then tap Forgot password.';return}
au.sendPasswordResetEmail(m).then(()=>{r.style.color='#1a9d6b';r.textContent='If that email has an account, a reset link is on its way. Check your spam folder too.'}).catch(e=>{r.textContent=e.code=='auth/invalid-email'?'That email does not look right.':e.code=='auth/too-many-requests'?'Too many tries. Please wait a few minutes.':'Could not send the reset email. Try again.'})};q1('#lp').onkeydown=e=>{if(e.key=='Enter')go()};
q1('#so').onclick=()=>au.signOut().then(()=>location.reload());
au.onAuthStateChanged(u=>{q1('#lg').style.display=u?'none':'flex';q1('#so').style.display=u?'block':'none';window.ME=u?u.email:null;window.DN=u?u.displayName:null;if(u){fs.doc('users/'+u.email.toLowerCase()).get().then(d=>{window.ROLE=d.exists?d.data().role:null;window.UNAME=d.exists?d.data().name:null}).catch(()=>{window.ROLE=null}).then(()=>res(db))}});
})();
</script>
<script>
const S=['Received','Processing','Ready','Collected'];
let PER=1000,WA={ready:'Hello {name}, your laundry (order {tag}) is ready for pickup at Rioes Laundry. Balance due: {bal}. Thank you!',readyd:'Hello {name}, your laundry (order {tag}) is ready for delivery. Balance due: {bal}. We will contact you to confirm the delivery time.',upd:'Hello {name}, order {tag} is now {st}.',unpaid:'Hello {name}, a friendly reminder: you have an unpaid balance of {bal} on order {tag}. Kindly pay by Mobile Money or cash.',survey:'Hi {name}, thank you for choosing Rioes Laundry! You now have {pts} loyalty points. How was order {tag}? Reply 1-5 (5 = excellent) and tell us what we can improve.',bday:'Happy birthday {name}! Enjoy 10% off your next order at Rioes Laundry this week.',back:'Hi {name}, we miss you at Rioes Laundry! Bring your next load this week and get double points.',receipt:'Rioes Laundry receipt {tag}\nDate: {date}\n{items}\nTotal: {total}\nPaid: {paid}\nBalance: {bal}\nLoyalty points: {pts}\nThank you {name}!'};
let SV=[['Wash & fold (per kg)',3000],['Shirt / blouse',8000],['Suit (2-piece)',25000],['Dress',12000],['Duvet / blanket',20000],['Ironing only (piece)',1000],['Curtains (per panel)',10000]];
const NAV=[['dash','🏠','Home'],['work','✅','Tasks'],['new','➕','New'],['orders','📋','Orders'],['cust','👥','Clients'],['rep','📊','Reports'],['set','⚙️','Settings']];
let D={c:{},o:[],n:1001},DBH=null,last={},SY='Saved on this device only';
try{const r=localStorage.getItem('rioes1');if(r)D=JSON.parse(r)}catch(e){}
const ren=()=>{if(V!=='new')render()};
function save(){try{localStorage.setItem('rioes1',JSON.stringify(D))}catch(e){}
if(!DBH)return;const w=(p,x)=>{const j=JSON.stringify(x);if(last[p]===j)return;last[p]=j;DBH.doc(p).set(x).catch(()=>{delete last[p];SY='Cloud sync failed, retrying on next save';ren()})};
D.o.forEach(o=>w('orders/'+o.id,o));Object.entries(D.c).forEach(([k,c])=>w('clients/'+k,c))}
async function initDb(){try{if(typeof claude==='undefined')return;const db=await claude.use('db');if(!db){SY='Cloud storage unavailable: data stays on this device';ren();return}
DBH=db;SY='Connecting to cloud storage…';ren();
const feed=(name,apply)=>db.collection(name).onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[name+'/'+d.id]={...d.data()};last[name+'/'+d.id]=JSON.stringify(d.data())});apply(m);SY='Saved to the cloud';save();ren()},e=>{SY='Cloud storage error: '+e.code;ren()});
feed('orders',m=>{const mine=D.o.filter(o=>!(('orders/'+o.id) in m)&&last['orders/'+o.id]===undefined);D.o=[...Object.values(m),...mine].sort((a,b)=>b.id-a.id)});
feed('clients',m=>{const c={};Object.entries(D.c).forEach(([k,v])=>{if(last['clients/'+k]===undefined)c[k]=v});Object.entries(m).forEach(([p,v])=>c[p.slice(8)]=v);D.c=c})}catch(e){SY='Cloud storage failed: data stays on this device';ren()}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const u=n=>'UGX '+Math.round(n).toLocaleString();
const ph=p=>{p=String(p).replace(/\D/g,'');if(p[0]=='0')p='256'+p.slice(1);return p};
const tier=p=>'';
let V='dash',q='',f='All';
let draft={items:[],ph:'',name:'',express:false,paid:'',redeem:false};
const nm=p=>(D.c[p]||{}).name||p;
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const wl=(p,t)=>'https://wa.me/'+p+'?text='+encodeURIComponent(t);
function msg(o){const n=nm(o.ph),b=o.net-o.paid;
if(o.st=='Ready')return `Hello ${n}, your laundry (order #${o.id}) is ready for pickup at Rioes Laundry. Balance due: ${u(b)}. Thank you!`;
if(o.st=='Collected')return `Thank you ${n}! You now have ${D.c[o.ph].pts} loyalty points (${tier(D.c[o.ph].pts)}). See you soon.`;
return `Hello ${n}, update on order #${o.id}: it is now at the ${o.st} stage.`}
function cpm(id){const o=D.o.find(x=>x.id==id);try{navigator.clipboard.writeText(msg(o)).then(()=>toast('Message copied'),()=>toast('Copy blocked by browser'))}catch(e){toast('Copy blocked by browser')}}
function adv(id){const o=D.o.find(x=>x.id==id),i=S.indexOf(o.st);if(i>=5)return;o.st=S[i+1];if(o.st=='Collected')o.paid=o.net;save();toast('Order #'+id+' → '+o.st);render()}
function oc(o){const i=S.indexOf(o.st);return `<div class="card"><div class="row"><b>#${o.id} ${esc(nm(o.ph))}</b><span class="tag">${o.st}</span></div>
<div class="mut">${o.items.map(x=>x.q+'× '+esc(x.n)).join(', ')}</div><div class="mut">${u(o.net)} • balance ${u(o.net-o.paid)}${o.express?' • express':''}</div>
<div class="row2">${i<5?`<button class="p" onclick="adv(${o.id})">${i==4?'Collect & mark paid':'Move to '+S[i+1]}</button>`:''}<a class="g" href="${wl(o.ph,msg(o))}" target="_blank" rel="noopener">WhatsApp</a><button class="g" onclick="cpm(${o.id})">Copy message</button></div></div>`}
function nav(){const h=NAV.map(n=>`<button class="nb ${V==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
$('#bot').innerHTML=h;$('#side').innerHTML='<div class="brand">Rioes Laundry<small>& Dry Cleaning, Kampala</small></div>'+h.replace(/<span>.*?<\/span>/g,m=>m.replace(/<\/?span>/g,'')+' ')}
function go(v){V=v;q='';f='All';render();scrollTo(0,0)}
function render(){nav();({dash:vDash,new:vNew,orders:vOrders,cust:vCust,rep:vRep})[V]()}
function seed(){const n=Date.now(),d=864e5;D.c={'256772100200':{name:'Amina K.',pts:120,spent:120000,visits:6},'256701555123':{name:'Brian O.',pts:40,spent:40000,visits:2},'256759888777':{name:'Cynthia N.',pts:310,spent:310000,visits:11}};
const mk=(id,p,it,st,t,ex)=>{const g=it.reduce((a,x)=>a+x.p*x.q,0);return{id,ph:p,items:it,express:ex,gross:g,disc:0,net:g,paid:st=='Collected'?g:Math.round(g/2),st,t}};
D.o=[mk(1001,'256772100200',[{n:SV[0][0],p:3000,q:6}],'Collected',n-2*d,0),mk(1002,'256701555123',[{n:SV[2][0],p:25000,q:1}],'Ready',n-d,0),mk(1003,'256759888777',[{n:SV[1][0],p:8000,q:4},{n:SV[5][0],p:1000,q:4}],'Washing',n,1)];D.n=1004;save();render()}
function vDash0(){const t=new Date().toDateString(),rev=D.o.filter(o=>new Date(o.t).toDateString()==t).reduce((a,o)=>a+o.paid,0),act=D.o.filter(o=>o.st!='Collected'),rd=D.o.filter(o=>o.st=='Ready');
$('#view').innerHTML=`<h2>Today at the counter</h2><div class="mut" style="margin:-6px 0 10px">${SY}</div><div class="grid"><div class="stat">Cash in today<b>${u(rev)}</b></div><div class="stat">In progress<b>${act.length}</b></div><div class="stat">Ready for pickup<b>${rd.length}</b></div><div class="stat">Clients<b>${Object.keys(D.c).length}</b></div></div>
${D.o.length?'':'<div class="card">No orders yet. Start with a real one, or load three demo orders to see how this behaves.<div class="row2"><button class="p" onclick="go(\'new\')">New order</button><button class="g" onclick="seed()">Load demo data</button></div></div>'}
${rd.length?'<h2>Waiting for collection</h2><div class="cols">'+rd.map(oc).join('')+'</div>':''}`}
function vNew(){const c=D.c[ph(draft.ph)];
$('#view').innerHTML=`<h2>New order</h2><div class="card"><label>Phone number</label><input id="fp" inputmode="tel" placeholder="0772 123 456" value="${esc(draft.ph)}" oninput="draft.ph=this.value;lk()">
<label>Name</label><input id="fn" value="${esc(draft.name)}" oninput="draft.name=this.value"><div id="lk" class="mut"></div></div>
<div class="card"><label>Add item</label><div class="row2" style="margin:0"><select id="sv" style="flex:2">${SV.map((s,i)=>`<option value="${i}">${s[0]} – ${u(s[1])}</option>`).join('')}</select><input id="qt" type="number" min="1" value="1" style="flex:1;min-width:70px"><button class="p" onclick="addI()">Add</button></div>
<div style="margin-top:8px">${draft.items.map((x,i)=>`<div class="row" style="padding:4px 0"><span>${x.q}× ${esc(x.n)} <span class="mut">@ ${u(x.p)}${x.sp&&x.sp!=x.p?' (was '+u(x.sp)+')':''}</span></span><span>${u(x.p*x.q)} <button class="g" style="padding:2px 8px" onclick="draft.items.splice(${i},1);vNew()">✕</button></span></div>`).join('')||'<span class="mut">No items yet.</span>'}</div></div>
<div class="card"><label class="ck"><input type="checkbox" ${draft.express?'checked':''} onchange="draft.express=this.checked;calc()"> Express service (+30%)</label>
<label>Redeem loyalty points</label><input type="number" min="0" step="${RPn()}" inputmode="numeric" placeholder="0" value="${esc(draft.rpts||'')}" oninput="draft.rpts=this.value;calc()"><div id="rdt" class="mut" style="margin-top:4px"></div>
<label>Paid now (UGX)</label><input id="pd" type="number" inputmode="numeric" value="${esc(draft.paid)}" oninput="draft.paid=this.value"><div id="sum" class="lines" style="margin-top:10px"></div>
<button class="p big" onclick="place()">Save order</button></div>`;lk()}
function lk(){const c=D.c[ph(draft.ph)],e=$('#lk');if(c){if(!draft.name){draft.name=c.name;$('#fn').value=c.name}e.textContent=`Returning client • ${c.pts} points`}else e.textContent=draft.ph?'New client – they will be added on save.':'';calc()}
function addI(){const s=SV[$('#sv').value],q=Math.max(1,+$('#qt').value||1),x=draft.items.find(i=>i.n==s[0]);if(x)x.q+=q;else draft.items.push({n:s[0],p:s[1],q});vNew()}
function calc(){const g=draft.items.reduce((a,x)=>a+x.p*x.q,0),ex=draft.express?Math.round(g*.3):0,c=D.c[ph(draft.ph)],mx=c?Math.floor(c.pts/RPn())*RVn():0,disc=draft.redeem?Math.min(mx,g+ex):0,net=g+ex-disc;
$('#rdt').textContent=`Redeem points (${c?c.pts:0} pts = ${u(mx)} off)`;
$('#sum').innerHTML=`<div><span>Subtotal</span><span>${u(g)}</span></div>${ex?`<div><span>Express</span><span>${u(ex)}</span></div>`:''}${disc?`<div><span>Loyalty discount</span><span>−${u(disc)}</span></div>`:''}<div><b>Total</b><b>${u(net)}</b></div><div class="mut"><span>Points earned on this order</span><span>${Math.floor(net/PER)}</span></div>`;return{g,ex,disc,net}}
function place(){const p=ph(draft.ph);if(p.length<10)return toast('Enter a valid phone number');if(!draft.items.length)return toast('Add at least one item');
const{g,ex,disc,net}=calc();let c=D.c[p];if(!c)c=D.c[p]=Object.assign({name:draft.name||'Client',pts:0,spent:0,visits:0},ncv());if(draft.name)c.name=draft.name;
c.pts-=Math.ceil(disc/2500)*50;c.pts+=Math.floor(net/1000);c.spent+=net;c.visits++;
const pin=Math.max(0,+draft.paid||0),cu=typeof cred==='number'?cred:0,pp=Math.min(pin,net-cu),xs=pin-pp,paid=pp+cu,id=Math.max(1000,...D.o.map(o=>o.id))+1;c.credit=(c.credit||0)-cu+xs;if(xs>0)(c.tops=c.tops||[]).push({a:xs,m:draft.pm,t:Date.now()});D.o.unshift({id,ph:p,items:draft.items,express:draft.express,gross:g+ex,disc,net,paid,st:'Received',t:Date.now()});save();
draft={items:[],ph:'',name:'',express:false,paid:'',redeem:false};toast('Order #'+id+' saved');V='orders';render()}
function vOrders0(){$('#view').innerHTML=`<h2>Orders</h2><input placeholder="Search name, phone or order number" value="${esc(q)}" oninput="q=this.value;ol()" style="margin-bottom:10px"><div class="chips">${['All',...S].map(s=>`<button class="chip ${f==s?'on':''}" onclick="f='${s}';vOrders()">${s}</button>`).join('')}</div><div id="ol" class="cols"></div>`;ol()}
function ol(){const t=q.toLowerCase(),r=D.o.filter(o=>(f=='All'||o.st==f)&&(!t||(o.id+' '+nm(o.ph)+' '+o.ph).toLowerCase().includes(t)));$('#ol').innerHTML=r.map(oc).join('')||'<div class="card mut">Nothing matches. Either a clean search or a very quiet day.</div>'}
let cf={ph:'',name:'',pts:'',edit:false},rm='';

function saveC(){const p=ph(cf.ph),n=cf.name.trim();if(!n)return toast('Enter the client name');if(p.length<10)return toast('Enter a valid phone number');const e=D.c[p];if(e&&!cf.edit)return toast('That number already belongs to '+e.name);const pts=Math.max(0,Math.floor(+cf.pts||0));

function oc0(o){const i=S.indexOf(o.st),b=bal(o),late=o.exp&&o.st!='Collected'&&o.exp<td();
return `<div class="card"><div class="row"><b>${tag(o)} ${esc(nm(o.ph))}</b><span class="tag">${o.st}</span></div><div class="mut">${o.items.map(x=>x.q+'× '+esc(x.n)).join(', ')}</div>
<div class="mut">${u(o.net)} • paid ${u(o.paid)} • <b style="color:${b?'#e5484d':'var(--ok)'}">balance ${u(b)}</b></div>
<div class="mut">Received: <input type="date" value="${ld(o.t)}" onchange="setT(${o.id},this.value)" style="width:auto;padding:2px 6px;display:inline-block"> ${new Date(o.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
<div class="mut" ${late?'style="color:#e5484d"':''}>Pickup: ${o.exp||'not set'}${late?' (overdue)':''}${o.express?' • express':''}</div>
${b>0?`<div class="row2"><input id="pa${o.id}" type="number" placeholder="Amount" style="flex:1;min-width:90px"><select id="pm${o.id}" style="flex:1;min-width:110px">${PM.map(m=>`<option>${m}</option>`).join('')}</select><button class="g" onclick="payO(${o.id})">Add payment</button></div>`:''}
<div class="row2">${i<3?`<button class="p" onclick="adv(${o.id})">${i==2?'Mark collected':'Move to '+S[i+1]}</button>`:''}<a class="g" href="${wl(o.ph,msg(o))}" target="_blank" rel="noopener">WhatsApp</a><div class="row2"><button class="g" onclick="rcpt(${o.id})">WhatsApp receipt</button><select id="pz${o.id}" style="flex:1;min-width:90px"><option value="58">58mm</option><option value="80" selected>3in/80mm</option><option value="a4">A4</option></select><button class="p" onclick="prcpt(${o.id},$('#pz'+${o.id}).value)">Print</button></div></div></div>`}

function ol(){const t=q.toLowerCase().replace(/^rl(?=\d)/,''),r=D.o.filter(o=>(f=='All'||o.st==f)&&(!t||(o.id+' '+nm(o.ph)+' '+o.ph).toLowerCase().includes(t)));$('#ol').innerHTML=r.map(oc).join('')||'<div class="card mut">Nothing matches.</div>'}
function pick(v,isN){const t=v.trim().toLowerCase(),e=Object.entries(D.c).find(([p,c])=>(c.name+' · '+p).toLowerCase()==t||p==ph(v)||c.name.toLowerCase()==t);if(isN)draft.name=v;else draft.ph=v;if(e){draft.ph=e[0];draft.name=e[1].name;$('#fp').value=e[0];$('#fn').value=e[1].name}lk()}

$('#view').innerHTML=`<h2>New order</h2><div class="card"><label>Client (type a name or number)</label><input id="fp" list="cs" autocomplete="off" placeholder="Name or 0772 123 456" value="${esc(draft.ph)}" oninput="pick(this.value)"><datalist id="cs">${Object.entries(D.c).map(([p,c])=>`<option value="${esc(c.name)} · ${p}">`).join('')}</datalist><label>Name</label><input id="fn" list="cs" value="${esc(draft.name)}" oninput="pick(this.value,1)"><div id="lk" class="mut"></div></div>
<div class="card"><label>Add item</label><div class="row2" style="margin:0"><select id="sv" style="flex:2">${SV.map((s,i)=>`<option value="${i}">${esc(s[0])} – ${u(s[1])}</option>`).join('')}</select><input id="qt" type="number" min="1" value="1" style="flex:1;min-width:70px"><button class="p" onclick="addI()">Add</button></div><div style="margin-top:8px">${draft.items.map((x,i)=>`<div class="row" style="padding:4px 0"><span>${x.q}× ${esc(x.n)} <span class="mut">@ ${u(x.p)}${x.sp&&x.sp!=x.p?' (was '+u(x.sp)+')':''}</span></span><span>${u(x.p*x.q)} <button class="g" style="padding:2px 8px" onclick="draft.items.splice(${i},1);vNew()">✕</button></span></div>`).join('')||'<span class="mut">No items yet.</span>'}</div></div>
<div class="card"><label>Order date (day it came in)</label><input type="date" value="${draft.dt||td()}" onchange="draft.dt=this.value"><label>Expected pickup / delivery date</label><input type="date" value="${draft.exp}" onchange="draft.exp=this.value"><label class="ck" style="margin-top:10px"><input type="checkbox" ${draft.express?'checked':''} onchange="draft.express=this.checked;calc()"> Express (+${EXL()})</label><label>Redeem loyalty points</label><input type="number" min="0" step="${RPn()}" inputmode="numeric" placeholder="0" value="${esc(draft.rpts||'')}" oninput="draft.rpts=this.value;calc()"><div id="rdt" class="mut" style="margin-top:4px"></div>
<label>Paid now / deposit (UGX)</label><div class="row2" style="margin:0"><input id="pd" type="number" inputmode="numeric" value="${esc(draft.paid)}" oninput="draft.paid=this.value" style="flex:2"><select onchange="draft.pm=this.value" style="flex:1">${PM.map(m=>`<option ${draft.pm==m?'selected':''}>${m}</option>`).join('')}</select></div><div id="sum" class="lines" style="margin-top:10px"></div><button class="p big" onclick="place()">Save order</button></div>`;lk()}
function place(){const p=ph(draft.ph);if(p.length<10)return toast('Pick a client or enter a valid phone number');if(!draft.items.length)return toast('Add at least one item');
const{g,ex,disc,net}=calc();let c=D.c[p];if(!c)c=D.c[p]=Object.assign({name:draft.name||'Client',pts:0,spent:0,visits:0},ncv());if(draft.name)c.name=draft.name;
c.pts-=Math.ceil(disc/2500)*50;c.pts+=Math.floor(net/PER);c.spent+=net;c.visits++;
const pin=Math.max(0,+draft.paid||0),cu=typeof cred==='number'?cred:0,pp=Math.min(pin,net-cu),xs=pin-pp,paid=pp+cu,id=Math.max(1000,...D.o.map(o=>o.id))+1;c.credit=(c.credit||0)-cu+xs;if(xs>0)(c.tops=c.tops||[]).push({a:xs,m:draft.pm,t:Date.now()});
D.o.unshift({id,ph:p,items:draft.items,express:draft.express,gross:g+ex,disc,net,paid,pays:[...(pp?[{a:pp,m:draft.pm,t:Date.now()}]:[]),...(cu?[{a:cu,m:'Account credit',t:Date.now()}]:[])],exp:draft.exp,st:'Received',t:(draft.dt&&draft.dt!=td()?new Date(draft.dt+'T12:00:00').getTime():Date.now())});
save();draft={items:[],ph:'',name:'',express:false,paid:'',redeem:false,exp:'',pm:'Cash',dt:''};toast('RL'+id+' saved');V='orders';render()}
const cfEmpty=()=>({ph:'',name:'',addr:'',room:'',bday:'',gen:'',pts:'',sp:'',sl:'',se:'',edit:false});cf=cfEmpty();
const fi=(l,k,t='text',x='')=>`<label>${l}</label><input type="${t}" value="${esc(cf[k])}" ${x} oninput="cf.${k}=this.value">`;
function vCust(){$('#view').innerHTML=`<h2>Clients</h2><div class="card"><b>${cf.edit?'Edit client':'Add a client'}</b>${fi('Name','name')}${fi('Mobile number','ph','tel',cf.edit?'readonly':'placeholder="0772 123 456"')}${fi('Address','addr')}${fi('Room number (optional)','room')}${fi('Birthday','bday','date')}<label>Gender</label><select onchange="cf.gen=this.value">${['','Female','Male','Other'].map(g=>`<option ${cf.gen==g?'selected':''}>${g}</option>`).join('')}</select>${fi('Loyalty points','pts','number')}<b style="display:block;margin-top:12px">Subscription (optional)</b>${fi('Plan name','sp')}${fi('Visits remaining','sl','number')}${fi('Expiry date','se','date')}
<div class="row2"><button class="p" onclick="saveC()">${cf.edit?'Save changes':'Add client'}</button>${cf.edit?'<button class="g" onclick="cf=cfEmpty();vCust()">Cancel</button>':''}</div></div>
<input placeholder="Search name or phone" value="${esc(q)}" oninput="q=this.value;cl()" style="margin-bottom:10px"><div class="chips">${[[0,'All'],[7,'1+ week'],[14,'2+ weeks'],[30,'1+ month'],[60,'2+ months'],[90,'3+ months']].map(s=>`<button class="chip ${seg==s[0]?'on':''}" onclick="seg=${s[0]};vCust()">${s[1]} away</button>`).join('').replace('All away','All')}</div><div id="cl" class="cols"></div>`;cl()}
function saveC(){const p=ph(cf.ph),n=cf.name.trim();if(!n)return toast('Enter the client name');if(p.length<10)return toast('Enter a valid phone number');const e=D.c[p];if(e&&!cf.edit)return toast('That number belongs to '+e.name);
const d={name:n,addr:cf.addr,room:cf.room||'',bday:cf.bday,gen:cf.gen,pts:Math.max(0,Math.floor(+cf.pts||0))};if(cf.sp||cf.sl||cf.se)d.sub={plan:cf.sp,left:+cf.sl||0,exp:cf.se};

function editC(p){const c=D.c[p],s=c.sub||{};cf={ph:p,name:c.name,addr:c.addr||'',room:c.room||'',bday:c.bday||'',gen:c.gen||'',pts:String(c.pts),sp:s.plan||'',sl:s.left===undefined?'':String(s.left),se:s.exp||'',edit:true};vCust();scrollTo(0,0)}

function cl0(){const t=q.toLowerCase(),now=Date.now(),r=Object.entries(D.c).map(([p,c])=>[p,c,lastOrd(p)]).filter(([p,c,l])=>(!t||(c.name+' '+p).toLowerCase().includes(t))&&(!seg||(l&&now-l>seg*DAY))).sort((a,b)=>b[1].spent-a[1].spent);
$('#cl').innerHTML=r.map(([p,c,l])=>{const d=l?Math.floor((now-l)/DAY):null,s=c.sub;return `<div class="card"><div class="row"><b>${esc(c.name)}</b></div><div class="mut">+${p}${c.gen?' • '+c.gen:''}${c.bday?' • 🎂 '+c.bday:''}</div>${c.addr?`<div class="mut">${esc(c.addr)}${c.room?' • Room '+esc(c.room):''}</div>`:''}
<div class="mut">${c.visits} visits • ${u(c.spent)} • ${c.pts} pts (${u(Math.floor(c.pts/RPn())*RVn())}) • ${d===null?'no orders yet':'last order '+d+' days ago'}</div>${s?`<div class="mut">📦 ${esc(s.plan||'Subscription')}: ${s.left} visits left${s.exp?', expires '+s.exp:''}</div>`:''}

function tasks0(){const T=[],now=Date.now(),t=td(),yr=t.slice(0,4);
D.o.forEach(o=>{const v=vars(o);if(o.st!='Collected'&&o.exp&&o.exp<=t)T.push([o.exp<t?'⏰ Overdue':'⏰ Due today',tag(o)+' '+v.name+' ('+o.st+')']);
