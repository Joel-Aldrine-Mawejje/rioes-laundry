<style>

.mut{color:var(--mut);font-size:13px}

.row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

a.g{display:inline-block;text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:700;border:1px solid var(--sky);color:var(--sky2)}button.big{width:100%;padding:13px;font-size:16px;margin-top:10px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}

.chip.on{background:var(--sky);color:#fff;border-color:var(--sky)}
.bar{height:10px;background:var(--sky);border-radius:5px;min-width:2px}

@media(min-width:800px){.side{display:flex}.bottom{display:none}main{padding:28px 32px}.grid{grid-template-columns:repeat(4,1fr)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{bottom:30px}}

<script>
(function(){const C=window.FIREBASE_CONFIG;if(!C||!C.apiKey||/PASTE/i.test(C.apiKey)||typeof firebase==='undefined')return;
firebase.initializeApp(C);const au=firebase.auth(),fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const clean=x=>JSON.parse(JSON.stringify(x)),

const q1=s=>document.querySelector(s);
const go=()=>{q1('#lr').style.color='#e5484d';q1('#lr').textContent='';au.signInWithEmailAndPassword(q1('#le').value.trim(),q1('#lp').value).catch(()=>q1('#lr').textContent='Could not sign in. Check the email and password.')};
q1('#lb').onclick=go;
q1('#lf').onclick=ev=>{ev.preventDefault();const r=q1('#lr'),m=q1('#le').value.trim();r.style.color='#e5484d';if(!m){r.textContent='Type your email above first, then tap Forgot password.';return}
au.sendPasswordResetEmail(m).then(()=>{r.style.color='#1a9d6b';r.textContent='If that email has an account, a reset link is on its way. Check your spam folder too.'}).catch(e=>{r.textContent=e.code=='auth/invalid-email'?'That email does not look right.':e.code=='auth/too-many-requests'?'Too many tries. Please wait a few minutes.':'Could not send the reset email. Try again.'})};q1('#lp').onkeydown=e=>{if(e.key=='Enter')go()};
q1('#so').onclick=()=>au.signOut().then(()=>location.reload());
au.onAuthStateChanged(u=>{q1('#lg').style.display=u?'none':'flex';q1('#so').style.display=u?'block':'none';window.ME=u?u.email:null;window.DN=u?u.displayName:null;if(u){fs.doc('users/'+u.email.toLowerCase()).get().then(d=>{window.ROLE=d.exists?d.data().role:null;window.UNAME=d.exists?d.data().name:null}).catch(()=>{window.ROLE=null}).then(()=>res(db))}});
})();
</script>

function vDash0(){const t=new Date().toDateString(),rev=D.o.filter(o=>new Date(o.t).toDateString()==t).reduce((a,o)=>a+o.paid,0),act=D.o.filter(o=>o.st!='Collected'),rd=D.o.filter(o=>o.st=='Ready');

${D.o.length?'':'<div class="card">No orders yet. Start with a real one, or load three demo orders to see how this behaves.<div class="row2"><button class="p" onclick="go(\'new\')">New order</button><button class="g" onclick="seed()">Load demo data</button></div></div>'}
${rd.length?'<h2>Waiting for collection</h2><div class="cols">'+rd.map(oc).join('')+'</div>':''}`}

function createSub(){

function addVisit(status){
  var sub=SUBS[subDet],sched=$('#svd').value,staff=$('#svst').value,orderId=$('#svoid').value,vnotes=$('#svn').value;
  if(!sched)return toast('Pick a scheduled date');
  var v={id:String(Date.now()),sched:sched,actualDate:status==='Done'?sched:'',status:status,staff:staff.trim(),orderId:orderId.trim(),vnotes:vnotes.trim(),addedAt:Date.now(),by:(window.ME||'').toLowerCase()};
  (sub.visits=sub.visits||[]).push(v);
  subLog(sub,'Visit '+status,sched+(staff?' – '+staff:''));
  svf={sched:'',staff:'',orderId:'',vnotes:''};
  putSub(sub);audit('add','Sub visit '+sub.id,status+' '+sched);toast('Visit recorded');vSubDetail();
}
function markVDone(i){var sub=SUBS[subDet],v=sub.visits[i];v.status='Done';v.actualDate=td();subLog(sub,'Visit completed',v.sched);putSub(sub);vSubDetail()}
function markVMiss(i){var sub=SUBS[subDet],v=sub.visits[i];v.status='Missed';subLog(sub,'Visit missed',v.sched);putSub(sub);vSubDetail()}
function cancelV(i){var sub=SUBS[subDet],v=sub.visits[i];v.status='Cancelled';subLog(sub,'Visit cancelled',v.sched);putSub(sub);vSubDetail()}
function addPay(){
  var sub=SUBS[subDet],a=Math.max(0,+$('#spa').value||0);
  if(!a)return toast('Enter an amount');
  var pm={id:String(Date.now()),date:$('#spd').value||td(),amt:a,method:$('#spm').value,period:$('#spp').value.trim(),note:$('#spn').value.trim(),status:'Paid',by:(window.ME||'').toLowerCase()};
  (sub.payments=sub.payments||[]).push(pm);
  subLog(sub,'Payment',u(a)+' – '+pm.method+(pm.period?' ('+pm.period+')':''));
  spf={};putSub(sub);audit('payment','Sub '+sub.id,u(a));toast('Payment recorded');subTab='billing';vSubDetail();
}
function cancelPay(i){if(!isO())return;var sub=SUBS[subDet],p=sub.payments[i];if(p.status==='Cancelled')return;p.status='Cancelled';subLog(sub,'Payment cancelled',u(p.amt)+' on '+p.date);putSub(sub);vSubDetail()}
function doPause(){var sub=SUBS[subDet];sub.status='Paused';subLog(sub,'Paused','');putSub(sub);audit('edit','Sub '+sub.id,'paused');vSubDetail()}
function doResume(){var sub=SUBS[subDet];sub.status='Active';subLog(sub,'Resumed','');putSub(sub);vSubDetail()}
function doRenew(){if(!isO())return;var sub=SUBS[subDet];var ed=new Date(sub.endDate+'T00:00:00');ed.setMonth(ed.getMonth()+sub.months);sub.endDate=ed.toISOString().slice(0,10);sub.status='Active';subLog(sub,'Renewed','New end: '+sub.endDate);putSub(sub);audit('edit','Sub '+sub.id,'renewed');toast('Renewed to '+sub.endDate);vSubDetail()}
function doCancel(){if(!isO())return;if(!confirm('Cancel this subscription?'))return;var sub=SUBS[subDet];sub.status='Cancelled';subLog(sub,'Cancelled','');putSub(sub);audit('edit','Sub '+sub.id,'cancelled');vSubDetail()}

/* Nudges in tasks */
var _tasksOld5=tasks;
tasks=function(){
  var T=_tasksOld5();
  Object.values(SUBS).forEach(function(sub){
    var st=subStatus(sub),vl=visLeft(sub),bl=subBalance(sub);
    var cname=nm(sub.ph);
    if(st==='Active'&&sub.endDate&&new Date(sub.endDate+'T00:00:00').getTime()-Date.now()<7*DAY)
      T.unshift(['📦 Sub expiring soon',cname+' • '+sub.id+' expires '+sub.endDate,wl(sub.ph,'Hello '+cname+', your '+sub.plan+' subscription ('+sub.id+') at Rioes Laundry expires on '+sub.endDate+'. Contact us to renew and keep your savings!'),"subDet='"+sub.id+"';subTab='overview';go('subs')",'']);
    if(st==='Overdue')
      T.unshift(['💰 Sub balance overdue',cname+' owes '+u(bl)+' on '+sub.id,wl(sub.ph,'Hello '+cname+', your subscription '+sub.id+' has an outstanding balance of '+u(bl)+'. Please clear it to continue your visits.'),"subDet='"+sub.id+"';subTab='billing';go('subs')",'']);
    if(st==='Active'&&vl===0)
      T.unshift(['✅ Sub visits all used',cname+' – '+sub.id+' ('+sub.totalVisits+' visits used)',wl(sub.ph,'Hello '+cname+', you have used all your visits on subscription '+sub.id+'. Contact us to renew!'),"subDet='"+sub.id+"';go('subs')",'']);
  });
  return T;
};

// ---- period helpers ----
var P6={period:30,cmpMode:'prev',cmpFrom:'',cmpTo:'',tab:'overview'};
var DAY6=864e5;
function p6Range(){
  var now=Date.now(),a=P6.period?now-P6.period*DAY6:0;
  return{a:a,b:now+1};
}
function p6CmpRange(a,b){
  if(P6.cmpMode==='prev'){var len=b-a;return{a:a-len,b:a}}
  if(P6.cmpMode==='custom'&&P6.cmpFrom&&P6.cmpTo)
    return{a:new Date(P6.cmpFrom+'T00:00:00+03:00').getTime(),b:new Date(P6.cmpTo+'T23:59:59+03:00').getTime()}
  return null;
}
function p6Label(){return P6.period?'Last '+P6.period+' days':'All time'}
function ld6(t){return new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function chg(a,b){if(!b)return'';var d=Math.round((a-b)/b*100);return'<span style="color:'+(d>=0?'var(--ok)':'#e5484d')+'"> '+(d>=0?'▲':'▼')+Math.abs(d)+'%</span>'}

// ---- data aggregation ----
function p6Agg(from,to){
  var O=D.o.filter(function(o){return o.t>=from&&o.t<to});
  var first={};D.o.forEach(function(o){if(!(o.ph in first)||o.t<first[o.ph])first[o.ph]=o.t});
  var cash=0,M={},S={},C={},daily={},weekday=[0,0,0,0,0,0,0],clients=new Set();
  O.forEach(function(o){
    if(o.pays&&o.pays.length)o.pays.forEach(function(p){if(p.t>=from&&p.t<to&&p.m!=='Account credit'){cash+=p.a;M[p.m]=(M[p.m]||0)+p.a}});
    else if(o.paid>0){cash+=o.paid;M.Cash=(M.Cash||0)+o.paid}
    (o.items||[]).forEach(function(i){S[i.n]=(S[i.n]||0)+i.p*i.q});
    C[o.ph]=(C[o.ph]||0)+o.net;
    var dk=ld6(o.t);daily[dk]=(daily[dk]||0)+o.net;
    weekday[new Date(o.t).getDay()]+=o.net;
    clients.add(o.ph);
  });
  var rev=O.reduce(function(a,o){return a+o.net},0);
  var allPhones=Object.keys(C);
  return{n:O.length,rev:rev,cash:cash,aov:O.length?rev/O.length:0,
    nw:allPhones.filter(function(p){return first[p]>=from}).length,
    ret:allPhones.filter(function(p){return first[p]<from}).length,
    owed:D.o.reduce(function(a,o){return a+o.net-o.paid},0),
    M:M,S:S,C:C,daily:daily,weekday:weekday,clients:clients.size};
}

// ---- expense aggregation ----
function p6Exp(from,to){
  var EX=Object.values(typeof EXS!=='undefined'?EXS:{}).filter(function(e){return e.status==='approved'&&new Date(e.date+'T00:00:00+03:00').getTime()>=from&&new Date(e.date+'T00:00:00+03:00').getTime()<to});
  var total=EX.reduce(function(a,e){return a+e.amt},0),cats={};
  EX.forEach(function(e){cats[e.cat]=(cats[e.cat]||0)+e.amt});
  return{total:total,cats:cats,n:EX.length};
}

// ---- sub revenue ----
function p6SubRev(from,to){
  return Object.values(SUBS).reduce(function(a,sub){
    return a+(sub.payments||[]).filter(function(p){return p.status==='Paid'&&new Date(p.date+'T00:00:00+03:00').getTime()>=from&&new Date(p.date+'T00:00:00+03:00').getTime()<to}).reduce(function(x,p){return x+(+p.amt||0)},0);
  },0);
}

// ---- lapsed client detection ----
function lapsedClients(){
  var now=Date.now(),results=[];
  Object.keys(D.c).forEach(function(p){
    var c=D.c[p];
    var orders=D.o.filter(function(o){return o.ph===p}).sort(function(a,b){return a.t-b.t});
    if(orders.length<2)return;
    var gaps=[];
    for(var i=1;i<orders.length;i++)gaps.push((orders[i].t-orders[i-1].t)/DAY6);
    var avgGap=gaps.reduce(function(a,g){return a+g},0)/gaps.length;
    var lastOrder=orders[orders.length-1];
    var daysSince=(now-lastOrder.t)/DAY6;
    var overdue=daysSince-avgGap;
    var active=D.o.some(function(o){return o.ph===p&&o.st!=='Collected'});
    if(overdue>5&&!active){
      results.push({p:p,c:c,avgGap:Math.round(avgGap),daysSince:Math.round(daysSince),overdue:Math.round(overdue),lastOrder:lastOrder,orders:orders.length});
    }
  });
  return results.sort(function(a,b){return b.overdue-a.overdue});
}

// ---- simple 4-week forecast ----
function forecast(){
  if(D.o.length<7)return null;
  var now=Date.now(),weeks=[];
  for(var w=7;w>=1;w--){
    var a=now-w*7*DAY6,b=a+7*DAY6;
    var rev=D.o.filter(function(o){return o.t>=a&&o.t<b}).reduce(function(x,o){return x+o.net},0);
    weeks.push(rev);
  }
  var avg=weeks.reduce(function(a,v){return a+v},0)/weeks.length;
  var trend=(weeks[weeks.length-1]-weeks[0])/(weeks.length-1||1);
  return{weeks:weeks,avg:avg,trend:trend,
    next4:Array.from({length:4},function(_,i){return Math.max(0,Math.round(avg+trend*(i+1)))})};
}

// ---- insights ----
function insights(cur,prv,exp){
  var tips=[];
  if(prv){
    if(cur.rev<prv.rev*0.85)tips.push({icon:'📉',text:'Revenue is down '+Math.round((1-cur.rev/prv.rev)*100)+'% vs the previous period. '+(cur.nw<prv.nw?'New client acquisition also dropped.':'Returning clients spent less.')});
    if(cur.nw<prv.nw*0.7&&prv.nw>2)tips.push({icon:'🔍',text:'Fewer new clients this period ('+cur.nw+' vs '+prv.nw+' previously). Consider a targeted promotion or referral incentive.'});
    if(cur.ret>cur.nw*2&&cur.rev>prv.rev)tips.push({icon:'⭐',text:'Strong repeat business this period – returning clients are driving growth. Keep loyalty rewards active.'});
  }
  var lapsed=lapsedClients();
  if(lapsed.length>0)tips.push({icon:'👋',text:lapsed.length+' client'+(lapsed.length>1?'s are':' is')+' overdue for a return. '+lapsed[0].c.name+' usually orders every '+lapsed[0].avgGap+' days but hasn\'t ordered in '+lapsed[0].daysSince+' days. A targeted reminder could recover lost revenue.'});
  if(exp.total>cur.rev*0.6&&cur.rev>0)tips.push({icon:'💸',text:'Expenses are '+Math.round(exp.total/cur.rev*100)+'% of revenue this period. Review non-essential costs.'});
  var wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var peak=cur.weekday.indexOf(Math.max.apply(null,cur.weekday));
  var quiet=cur.weekday.indexOf(Math.min.apply(null,cur.weekday));
  if(cur.weekday[peak]>0)tips.push({icon:'📅',text:'Peak day: '+wd[peak]+'. Quietest: '+wd[quiet]+'. Consider scheduling maintenance or staff leave on '+wd[quiet]+'s.'});
  var topSvc=Object.keys(cur.S).sort(function(a,b){return cur.S[b]-cur.S[a]})[0];
  if(topSvc)tips.push({icon:'🏆',text:'Top service: '+topSvc+' ('+u(cur.S[topSvc])+'). Ensure it\'s always prominently offered to new clients.'});
  return tips;
}

// ---- chart helpers ----
var chartReg={};
function mkChart(id,type,labels,datasets,opts){
  if(chartReg[id]){try{chartReg[id].destroy()}catch(e){}}
  var el=document.getElementById(id);if(!el)return;
  chartReg[id]=new Chart(el,{type:type,data:{labels:labels,datasets:datasets},options:Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'var(--ink)'}}}},opts||{})});
}
function barDs(label,data,color){return{label:label,data:data,backgroundColor:color||'rgba(56,182,240,0.7)',borderColor:color||'#38b6f0',borderWidth:1}}
function lineDs(label,data,color){return{label:label,data:data,borderColor:color||'#38b6f0',backgroundColor:(color||'rgba(56,182,240,0.15)'),fill:true,tension:0.3,pointRadius:3}}

// ---- PDF/Excel export ----
function exportPDF(){window.print()}
function exportCSV(cur,exp,r){
  var rows=[['Metric','Value'],
    ['Period',p6Label()],
    ['Orders',cur.n],['Revenue earned (UGX)',Math.round(cur.rev)],
    ['Cash collected (UGX)',Math.round(cur.cash)],
    ['Avg order value (UGX)',Math.round(cur.aov)],
    ['New clients',cur.nw],['Returning clients',cur.ret],
    ['Unpaid balances (UGX)',Math.round(cur.owed)],
    ['Approved expenses (UGX)',Math.round(exp.total)],
    ['Gross profit (UGX)',Math.round(r.gp)],
    ['Profit margin',Math.round(r.margin)+'%'],
    [''],['Expenses by category']];
  Object.keys(exp.cats).forEach(function(k){rows.push([k,Math.round(exp.cats[k])])});
  rows.push([''],['Revenue by service']);
  Object.keys(cur.S).sort(function(a,b){return cur.S[b]-cur.S[a]}).forEach(function(k){rows.push([k,Math.round(cur.S[k])])});
  var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c||'').replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='Rioes-report-'+td()+'.csv';document.body.appendChild(a);a.click();a.remove();toast('CSV downloaded – open in Excel or Sheets');
}
